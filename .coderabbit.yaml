# .coderabbit.yaml
language: "ja"
tone_instructions: "簡潔で具体的に。Markdownテンプレートの品質・構造・整合性を重視"

reviews:
  profile: "assertive"
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_instructions:
    - path: "project-blueprint/.claude/skills/*/SKILL.md"
      instructions: |
        スキルファイルのレビュー観点:
        - frontmatter(name, description)が正確か
        - 「前提条件」「基本姿勢」「使い方」「ワークフロー」「出力契約」「禁止事項」の構造を維持しているか
        - 他スキルとの連携（前工程/後工程）が正しく定義されているか
        - 出力先ディレクトリが規約に沿っているか（output/reports/, docs/等）
        - project-config.mdのセクション番号参照が正しいか
    - path: "project-blueprint/.claude/teams/TEAM_*.md"
      instructions: |
        チームテンプレートのレビュー観点:
        - チーム構成表のスキル名がskills/配下に存在するか
        - スキルカバレッジ表とチーム構成表のスキル名が一致しているか
        - ワークフローの依存関係が論理的に正しいか
        - 完了条件が各役割の責務と対応しているか
        - 役割間の棲み分けが明確か
    - path: "project-blueprint/.claude/CLAUDE.md"
      instructions: |
        開発ガイドのレビュー観点:
        - スキル一覧がskills/配下の全スキルを網羅しているか
        - スキル選定基準が全スキルをカバーしているか
        - チームテンプレート一覧がteams/配下の全チームを網羅しているか
        - ドキュメント管理方針の更新責務テーブルが最新か
    - path: "project-blueprint/project-config.md"
      instructions: |
        プロジェクト設定テンプレートのレビュー観点:
        - 12セクション(§1〜§12)の番号が連続しているか
        - スキルから参照されるセクション番号が正しいか
        - テンプレートとしての汎用性が保たれているか（特定プロジェクト固有の値が混入していないか）
    - path: "project-blueprint/docs/**"
      instructions: |
        ドキュメントスタブのレビュー観点:
        - テンプレートとしての構造が明確か
        - AIが埋めるべきセクションが分かりやすいか
    - path: "**/*.md"
      instructions: |
        Markdown共通:
        - 日本語で記述されているか（ENブループリント配下は英語可）
        - テーブルの列数がヘッダーと一致しているか
        - 内部リンク（相対パス）の参照先が存在するか
